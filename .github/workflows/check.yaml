# Runs the unit tests and the full tutorial analysis on every push and pull
# request to main, using the package versions pinned in renv.lock.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} (R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        r: ['4.5.3']   # keep in sync with the R version in renv.lock

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      # CRAN only ships macOS binaries for the latest package versions, so
      # renv compiles older pinned versions from source. Some (e.g.,
      # data.table) need gettext, installed from CRAN's macOS library recipes.
      # Run outside the project with --vanilla so the project's .Rprofile does
      # not activate renv as root (which leaves root-owned renv lock files).
      - name: Install macOS system libraries
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}
        run: |
          sudo Rscript --vanilla -e 'source("https://mac.R-project.org/bin/install.R"); install.libs("gettext")'

      - uses: r-lib/actions/setup-renv@v2

      - name: Run unit tests
        run: |
          res <- testthat::test_dir("tests/testthat", reporter = "summary",
                                    stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Run tutorial analysis end to end
        run: source("analysis/cSTM_time_indep.R")
        shell: Rscript {0}
